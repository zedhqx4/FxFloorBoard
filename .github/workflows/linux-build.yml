name: Linux build (SVN baseline modernization)

on:
  push:
    branches:
      - GT10-SVN-Modernization-Clean
      - rewrite-code
  pull_request:
    branches:
      - GT10-SVN-Modernization-Clean
      - rewrite-code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 22.04 / Qt 5 / ALSA
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            qtbase5-dev \
            qtbase5-dev-tools \
            qt5-qmake \
            libasound2-dev

      - name: Show toolchain
        run: |
          qmake -v
          qmake -query QT_VERSION
          g++ --version
          pkg-config --modversion alsa

      - name: Configure original SVN baseline
        run: qmake GT-10FxFloorBoard.pro CONFIG+=release

      - name: Build
        run: make --jobs=2

      - name: Verify executable
        run: |
          test -x GT-10FxFloorBoard
          file GT-10FxFloorBoard

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: FxFloorBoard-linux-svn-baseline-${{ github.sha }}
          path: GT-10FxFloorBoard
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
