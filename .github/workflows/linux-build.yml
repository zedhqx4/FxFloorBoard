name: Linux build (Qt 5)

on:
  push:
    branches:
      - gt-10-midi-modernization
      - GT10-SVN-Modernization
  pull_request:
    branches:
      - gt-10-midi-modernization
      - GT10-SVN-Modernization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 22.04 / Qt 5 / ALSA
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            qtbase5-dev \
            qtbase5-dev-tools \
            qt5-qmake \
            libasound2-dev

      - name: Show and verify toolchain
        run: |
          qmake -v
          qt_version="$(qmake -query QT_VERSION)"
          echo "Qt version: $qt_version"
          test "${qt_version%%.*}" = "5"
          g++ --version
          pkg-config --modversion alsa

      - name: Check removed Qt 6 API migration blockers
        run: |
          if grep -R -n -E 'QDesktopWidget' \
            --include='*.cpp' --include='*.h' .; then
            echo "Legacy desktop/platform API found"
            exit 1
          fi

      - name: Configure with qmake
        run: |
          qmake GT-10FxFloorBoard.pro CONFIG+=release

      - name: Build
        run: |
          make --jobs=2

      - name: Verify executable
        run: |
          test -x packager/GT-10FxFloorBoard

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: FxFloorBoard-linux-qt5-${{ github.sha }}
          path: packager/GT-10FxFloorBoard
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
